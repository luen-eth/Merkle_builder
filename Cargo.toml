[package]
name = "merkle-builder"
version = "0.1.0"
edition = "2021"
description = "Merkle tree and proof generator for EVM whitelists and airdrops, with a CLI and a web interface"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-keccak = { version = "2", features = ["keccak"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
